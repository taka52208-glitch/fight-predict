 name: x-hit-log                                                                                                                                                                 
                                                                                                                                                                                  
  on:
    schedule:                                                                                                                                                                     
      - cron: '15 23 * * *'
    workflow_dispatch:

  jobs:
    hitlog:
      runs-on: ubuntu-latest
      timeout-minutes: 20                                                                                                                                                         
      steps:
        - uses: actions/checkout@v4                                                                                                                                               
        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'
        - name: Generate hit-log drafts and send email                                                                                                                            
          env:
            GMAIL_USER: ${{ secrets.GMAIL_USER }}                                                                                                                                 
            GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
            RECIPIENT: ${{ secrets.RECIPIENT }}                                                                                                                                   
          run: python .github/scripts/generate_hit_log.py
                                                              
