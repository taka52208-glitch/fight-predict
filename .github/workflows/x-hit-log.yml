name: x-hit-log

# 毎朝8時JSTに、直近3日以内に終了した大会の「AI予測 vs 結果」X投稿下書きを
# 生成してGmailへ送信。対象大会がない・投稿可能な履歴がない日はスキップ。
on:
  schedule:
    - cron: '15 23 * * *'  # 23:15 UTC = 08:15 JST (daily drafts の15分後にずらす)
  workflow_dispatch:

jobs:
  hitlog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests requests-oauthlib
      - name: Generate hit-log (post to X if enabled, always email)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          X_BOT_ENABLED: ${{ secrets.X_BOT_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python .github/scripts/generate_hit_log.py
