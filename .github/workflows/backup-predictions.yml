name: backup-predictions

# 2時間ごとに /api/predictions/export を叩いて予測履歴を
# backend/data/prediction_history.json にコミット。Render再デプロイ時に
# ここから履歴が復元される。render.yaml の ignoredPaths で
# backend/data/** を除外しているので、このコミット自体は
# Renderを再デプロイしない。
on:
  schedule:
    - cron: '5 */2 * * *'  # 2時間ごと（各時0分のping混雑を避けて5分ずらし）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prediction history
        run: python .github/scripts/backup_predictions.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain backend/data/prediction_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/data/prediction_history.json
            COUNT=$(python -c "import json; print(len(json.load(open('backend/data/prediction_history.json'))))")
            git commit -m "chore: 予測履歴バックアップ (${COUNT}件) [skip ci]"
            git push
            echo "履歴変化をコミットしました"
          else
            echo "変化なし。コミットスキップ"
          fi
